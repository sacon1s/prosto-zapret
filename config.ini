# Zapret Pro config
# STRATEGY - nomer strategii (1..27), vybiraetsya avtomatom cherez TUNE.bat
STRATEGY=3
# versiya yadra Flowseal (obnovlyaetsya cherez UPDATE.bat)
CORE_VERSION=1.10.4
# IPSET=1 - obhod dopolnitelnyh servisov po spisku IP (vklyucheno); 0 - tolko Discord/YouTube po domenam
IPSET=1
# GAME_FILTER: off | tcp | udp | both (dobavlyaet diapazon portov dlya igr v obhod)
GAME_FILTER=off
GAME_FILTER_TCP=1024-65535
GAME_FILTER_UDP=1024-65535
# taymaut proverki dostupa, sek
CHECK_TIMEOUT=5
# interval proverki zdoroviya u storozha, sek (min 60)
WATCHDOG_INTERVAL=180
# 1 - pri neudachnom starte avtomatom perebiraet strategii (TUNE)
AUTOTUNE_ON_FAIL=1
TUNED_AT=2026-11-23 01:23
RESTORED_SERVICE=ZapretGUI.Bypass.S-1-5-21-3814288463-4266283684-529990395-1001
RESTORED_SERVICE_START_ZAPRETGUI.BYPASS.S-1-5-21-3814288463-4266283684-529990395-1001=4

