# Prosto Zapret: настройки
# Строки после решётки — пояснения, программа их не читает.

# Номер стратегии. Выбирается автоматически через "5 - ПОДБОР НАСТРОЕК.bat".
STRATEGY=1

# 1 — обходить и по списку IP-подсетей (больше сервисов), 0 — только по доменам из списков.
IPSET=1

# Игровой режим: off | tcp | udp | both. Нужен, только если провайдер мешает игровому трафику.
GAME_FILTER=off
GAME_FILTER_TCP=1024-65535
GAME_FILTER_UDP=1024-65535

# Таймаут проверки доступа, секунды.
CHECK_TIMEOUT=5

# Как часто сторож проверяет доступ, секунды (минимум 60).
WATCHDOG_INTERVAL=180

# 1 — при неудачном запуске самому перебирать стратегии.
AUTOTUNE_ON_FAIL=1

# 1 — раз в сутки перепроверять стратегию и ночью запускать подбор, если доступ не идеальный.
RECALIBRATE=1
# Час ночной перепроверки, от 0 до 23.
RECALIBRATE_HOUR=4

# Версии. Обновляются сами, вручную менять не нужно.
PRODUCT_VERSION=0.0.4
CORE_VERSION=1.10.4
